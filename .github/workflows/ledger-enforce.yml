name: Test & Ledger Enforcement

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt || true
      - name: Run tests
        id: run_tests
        run: |
          pytest apps/api/tests/ -q || echo "PYTEST_FAILED"
      - name: Fail CI if tests failed and ledger not updated
        run: |
          if pytest --maxfail=1 --disable-warnings -q apps/api/tests/; then
            echo "Tests passed."
            exit 0
          else
            echo "Tests failed. Checking for docs/DEFECT_LEDGER.md in commits..."
            git fetch origin master || true
            CHANGED=$(git diff --name-only origin/master...HEAD || true)
            echo "Changed files:\n$CHANGED"
            echo "$CHANGED" | grep -q "docs/DEFECT_LEDGER.md" && { echo "Ledger updated in this branch — allowing failure."; exit 0; } || { echo "Tests failed and docs/DEFECT_LEDGER.md not updated. Failing workflow."; exit 1; }
        shell: bash
