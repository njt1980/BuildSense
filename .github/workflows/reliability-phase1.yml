name: Reliability Phase 1

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  preflight-checks:
    name: Preflight and Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so the phase-gate step below can diff
          # against the PR base ref / previous push commit.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run phase-gate check (post-BUG-028 guardrail) on changed files
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1...HEAD || true)
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # check_approval_evidence() cannot pass here: git notes are not
          # transferred by a plain push or fetched by a default checkout,
          # so this fresh actions/checkout@v4 clone will never have
          # refs/notes/approvals. Do NOT "fix" this by trying to push/fetch
          # notes into CI without re-reading spec.md/design.md for BS-1
          # (BUG-040) first -- that tradeoff was deliberately declined.
          python scripts/check_phase_gate.py --skip-approval-evidence --staged-files $CHANGED
          echo "CHANGED<<PHASE_GATE_CHANGED_EOF" >> "$GITHUB_ENV"
          echo "$CHANGED" >> "$GITHUB_ENV"
          echo "PHASE_GATE_CHANGED_EOF" >> "$GITHUB_ENV"

      - name: Run secrets/debug-statement lint on changed files
        run: |
          python scripts/check_secrets_and_debug_statements.py --staged-files $CHANGED

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy backend type checks
        working-directory: apps/api
        run: |
          python -m mypy app/

      - name: Run pytest (fast tests)
        working-directory: apps/api
        run: |
          pytest tests/ -q

  frontend-typecheck:
    name: Frontend Type-Check
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run TypeScript type-check
        working-directory: apps/web
        run: |
          npm run type-check
