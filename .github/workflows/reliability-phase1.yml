name: Reliability Phase 1

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  preflight-checks:
    name: Preflight and Backend Checks
    runs-on: ubuntu-latest
    env:
      # If you prefer repository secrets, set them in repo settings and the values will be available here as ${{ secrets.NAME }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if required infra secrets are missing
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "ERROR: DATABASE_URL secret is not set."; exit 1; fi
          if [ -z "${REDIS_URL}" ]; then echo "ERROR: REDIS_URL secret is not set."; exit 1; fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy backend type checks
        working-directory: apps/api
        run: |
          python -m mypy app/ || true

      - name: Run pytest (fast tests)
        working-directory: apps/api
        run: |
          pytest tests/ -q || true

  frontend-typecheck:
    name: Frontend Type-Check
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run TypeScript type-check
        working-directory: apps/web
        run: |
          npm run type-check
