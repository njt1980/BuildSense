name: Push Freshness

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  MAX_STALE_DAYS: 3

jobs:
  check-push-freshness:
    name: Check master hasn't gone stale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run push-freshness check
        run: |
          python scripts/check_push_freshness.py --max-days "$MAX_STALE_DAYS"
